services:
  - type: web
    name: debug-assistant
    runtime: python
    buildCommand: cd debug_assistant/frontend && npm install && npm run build && cd ../.. && pip install -r debug_assistant/backend/requirements.txt
    startCommand: uvicorn debug_assistant.backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: "*"
